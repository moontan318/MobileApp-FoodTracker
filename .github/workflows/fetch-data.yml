name: Refresh food data

# Re-downloads the UK source data (CoFID and the restaurant menus), rebuilds
# app/src/main/assets/foods.tsv and commits the result to the branch it was run on.
# Run it from the Actions tab ("Run workflow") to pick up menu changes.
on:
  workflow_dispatch:
  push:
    branches: [claude/trusting-galileo-r145fm]
    paths: [tools/fetch_sources.py]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl playwright && python -m playwright install --with-deps firefox
      - run: python -I tools/fetch_sources.py
      - run: python -I tools/build_food_db.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add tools/sources app/src/main/assets
          git diff --cached --quiet && exit 0
          git commit -m "Refresh food data"
          git push
