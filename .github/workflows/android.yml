name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :core:test --stacktrace

      - name: Build APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MealMacros.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MealMacros-apk
          path: MealMacros.apk

      # Every push to main publishes a GitHub release so the APK can be downloaded
      # straight onto a phone from the repository's Releases page.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Meal Macros 1.0.${{ github.run_number }}
          body: Install `MealMacros.apk` on your Android phone (allow installs from your browser / file manager when prompted).
          files: MealMacros.apk
